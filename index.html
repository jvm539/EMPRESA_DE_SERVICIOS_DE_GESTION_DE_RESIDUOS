let db;
function load(){try{let raw=localStorage.getItem(STORE);db=raw?JSON.parse(raw):structuredClone(defaults)}catch(e){db=JSON.parse(JSON.stringify(defaults))} if(!db.config)db=JSON.parse(JSON.stringify(defaults))}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN',maximumFractionDigits:2}).format(Number(n)||0)}
function num(n){return new Intl.NumberFormat('es-PE',{maximumFractionDigits:2}).format(Number(n)||0)}
function dateFmt(s){if(!s)return '—';let d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('es-PE')}
function waste(id){return db.wastes.find(w=>w.id===id)||{name:'Residuo eliminado',hazard:'Por evaluar',class:'Por clasificar'}}
function total(arr,key){return arr.reduce((a,x)=>a+(Number(x[key])||0),0)}

function go(p){current=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=pages[p];document.getElementById('topTitle').textContent=pages[p];document.getElementById('sidebar').classList.remove('open');render()}

function card(title,body,extra=''){return `<div class="card"><div class="cardhead"><h3>${title}</h3>${extra}</div>${body}</div>`}
function stat(label,value,foot,icon){return `<div class="card"><div class="statlabel"><span>${label}</span><span class="staticon">${icon}</span></div><div class="statnum">${value}</div><div class="statfoot">${foot}</div></div>`}
function pill(text,type=''){return `<span class="pill ${type}">${esc(text)}</span>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td class="empty" colspan="${headers.length}">No hay registros. Utilice “Agregar” para comenzar.</td></tr>`}</tbody></table></div>`}
function wasteOptions(selected=''){return db.wastes.map(w=>`<option value="${w.id}" ${w.id===selected?'selected':''}>${esc(w.name)}</option>`).join('')}
function statusPill(s){let low=(s||'').toLowerCase();return pill(s,low.includes('cerrado')||low.includes('conforme')||low.includes('confirmada')||low.includes('complet')?'':low.includes('pendiente')||low.includes('curso')||low.includes('verificar')?'warn':'gray')}

function currentMonthGen(){let m=new Date().toISOString().slice(0,7);return db.generations.filter(g=>(g.date||'').slice(0,7)===m).reduce((s,g)=>s+(+g.qty||0),0)}

ype="number" value="'+num(Math.max(0,shipped-val)).replace(',','')+'" min="0" style="width:100px;padding:7px;border:1px solid #ccd6de;border-radius:7px"></p><button onclick="calcBalance()">Calcular stock final</button><div id="balResult" class="sectiongap small muted">Ingrese cantidades de un mismo periodo y alcance.</div>') }</div>

`<div class="grid two">${card('Informe ejecutivo',`<div class="reporthead"><svg viewBox="0 0 100 100" aria-label="Logo SA Andinos"><path d="M50 4 91 27v46L50 96 9 73V27Z" fill="#193b50"/><path d="M16 68 36 39 49 56 62 28 85 68Z" fill="#b8d94b"/><path d="M21 74Q48 62 79 74" fill="none" stroke="#fff" stroke-width="4"/></svg><div><b>${esc(db.config.company)}</b><div class="small muted">Plan de Minimización y Manejo de Residuos Sólidos No Municipales</div><div class="small muted">Periodo ${esc(db.config.period)} · Versión ${esc(db.config.version)}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p><b>Elaborado por:</b> ${esc(db.config.elaborated)}</p><p><b>Aprobado por:</b> ${esc(db.config.approved)}</p><p><b>Actividad:</b> ${esc(db.config.activity)}</p><p><b>Ubicación:</b> ${esc(db.config.location)}</p><div class="callout warn">Este informe es un formato demostrativo y no constituye una presentación oficial ni reemplaza el instrumento ambiental de la unidad minera.</div><div class="formactions">${btn('Imprimir / Guardar PDF',"window.print()")}</div>`)}
${card('Control de referencias normativas y documentos',table(['Documento','Estado de revisión','Fecha','Observaciones','Acciones'],rows),btn('＋ Documento',"openForm('doc')"))}</div>
<div class="sectiongap">${card('Alcance de reporte y cumplimiento','<ul><li>Verificar obligaciones y periodicidad de reporte en SIGERSOL No Municipal cuando correspondan.</li><li>Confirmar manifiestos y documentación aplicable a residuos peligrosos.</li><li>Archivar comprobantes de pesaje, transporte, recepción y valorización.</li><li>Vincular este plan al instrumento de gestión ambiental y a las obligaciones sectoriales de la unidad minera.</li><li>Verificar la versión vigente de normas y regímenes especiales antes de aprobar o reportar.</li></ul>')}</div>`
}

return pagehead('Configuración de empresa y plan','Personaliza datos generales, responsables, periodo y metas internas.',btn('Guardar configuración',"saveConfig()")+btn('Restaurar datos de ejemplo',"resetData()",'danger'))+
`<div class="grid two"><div class="card"><h3>Datos de la empresa</h3><div class="formgrid">
<div class="field full"><label>Razón social</label><input id="cfg_company" value="${esc(c.company)}"></div>
<div class="field full"><label>Actividad económica</label><textarea id="cfg_activity">${esc(c.activity)}</textarea></div>
<div class="field full"><label>Ubicación de unidad minera</label><input id="cfg_location" value="${esc(c.location)}"></div>

<div class="field"><label>Número de trabajadores</label><input id="cfg_workers" type="number" min="0" value="${esc(c.workers)}"></div>
<div class="field"><label>Periodo del plan</label><input id="cfg_period" value="${esc(c.period)}"></div>

</div></div><div class="card"><h3>Responsables y metas</h3><div class="formgrid">

<div class="field full"><label>Aprobado por</label><input id="cfg_approved" value="${esc(c.approved)}"></div>
<div class="field"><label>Línea base anual (kg)</label><input id="cfg_baseline" type="number" min="0" value="${esc(c.baseline)}"></div>
<div class="field"><label>Meta reducción (%)</label><input id="cfg_targetReduction" type="number" min="0" max="100" value="${esc(c.targetReduction)}"></div>
<div class="field"><label>Meta valorización (%)</label><input id="cfg_targetValorization" type="number" min="0" max="100" value="${esc(c.targetValorization)}"></div>
<div class="field full"><label>Notas y alcance</label><textarea id="cfg_notes">${esc(c.notes)}</textarea></div>
</div><div class="callout sectiongap">Elaborado por: <b>${esc(c.elaborated)}</b><br>Aprobado por: <b>${esc(c.approved)}</b></div></div></div>
<div class="sectiongap">${card('Identidad visual','<div class="reporthead"><svg viewBox="0 0 100 100" width="76" height="76"><path d="M50 4 91 27v46L50 96 9 73V27Z" fill="#193b50"/><path d="M16 68 36 39 49 56 62 28 85 68Z" fill="#b8d94b"/><path d="M21 74Q48 62 79 74" fill="none" stroke="#fff" stroke-width="4"/></svg><div><b>SA ANDINOS</b><p class="small muted">Montañas, agua y hoja: minería responsable, gestión ambiental y territorio andino.</p></div></div>')}</div>
<div class="footer">La aplicación funciona en el navegador local. Los datos no se envían a un servidor; exporte respaldos periódicos. No introducir datos personales sensibles ni documentos confidenciales en equipos compartidos.</div>`
}
function render(){let f={dashboard,diagnostico,minimizacion,manejo,salidas,incidentes,indicadores,presupuesto,cronograma,capacitacion,reportes,configuracion};document.getElementById('content').innerHTML=f[current]();save()}
function openModal(title,body){document.getElementById('modalContent').innerHTML=`<h2>${title}</h2>${body}`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function field(label,name,type='text',value='',opts=null,full=false,required=false){let inp=type==='select'?`<select name="${name}" ${required?'required':''}>${opts.map(o=>{let pair=String(o).includes('|')?String(o).split('|',2):[o,o];let ov=pair[0],ol=pair[1];return `<option value="${esc(ov)}" ${String(ov)===String(value)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`:type==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''} ${required?'required':''}>`;return `<div class="field ${full?'full':''}"><label>${label}${required?' *':''}</label>${inp}</div>`}
function formWrap(kind,id,title,fields){openModal(title,`<form id="editForm" onsubmit="submitForm(event,'${kind}','${id||''}')"><div class="formgrid">${fields}</div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button type="submit">Guardar registro</button></div><div class="footer">Los campos se guardan localmente en este navegador. Los registros de ejemplo pueden editarse o eliminarse.</div></form>`)}
function openForm(kind,id=null){let x=id?findItem(kind,id):{};
switch(kind){
case'waste':formWrap(kind,id,'Tipo de residuo',field('Nombre','name','text',x.name||'',null,false,true)+field('Área de generación','area','text',x.area||'')+field('Clasificación preliminar','class','select',x.class||'No peligroso',['No peligroso','Peligroso (preliminar)','Régimen especial por verificar','Por caracterizar'])+field('Peligroso','hazard','select',x.hazard||'No',['No','Sí','Por evaluar'])+field('Línea base anual (kg)','baseline','number',x.baseline??0)+field('Unidad','unit','select',x.unit||'kg',['kg','t','L','unidad'])+field('Ruta prevista','route','text',x.route||'',null,true)+field('Meta de reducción (%)','target','number',x.target??0));break;
case'generation':formWrap(kind,id,'Registrar generación de residuos',field('Fecha','date','date',x.date||today(),null,false,true)+field('Residuo','wasteId','select',x.wasteId||db.wastes[0]?.id,db.wastes.map(w=>w.id+'|'+w.name).map(z=>z),false,true).replace(/<option value="([^"]+)"/g,(m,v)=>`<option value="${v.split('|')[0]}"` ).replace(/>([^<]+)\|([^<]+)<\/option>/g,'>$2</option>')+field('Cantidad (kg)','qty','number',x.qty??0,null,false,true)+field('Área','area','text',x.area||'Mantenimiento mina')+field('Observaciones','notes','textarea',x.notes||'',null,true));break;
case'initiative':formWrap(kind,id,'Medida de minimización',field('Nombre de la medida','name','text',x.name||'',null,true,true)+field('Residuo asociado','waste','text',x.waste||'')+field('Responsable','owner','text',x.owner||'')+field('Fecha objetivo','due','date',x.due||'2027-12-31')+field('Línea base (kg/año)','baseline','number',x.baseline??0)+field('Objetivo (kg/año)','target','number',x.target??0)+field('Estado','status','select',x.status||'Pendiente',['Pendiente','En curso','Completada','Reprogramada'])+field('Avance (%)','progress','number',x.progress??0));break;
case'storage':formWrap(kind,id,'Movimiento de almacenamiento',field('Fecha','date','date',x.date||today(),null,false,true)+field('Residuo','wasteId','select',x.wasteId||db.wastes[0]?.id,db.wastes.map(w=>w.id+'|'+w.name),false,true)+field('Ubicación','location','text',x.location||'Zona A')+field('Stock inicial (kg)','opening','number',x.opening??0)+field('Ingreso (kg)','incoming','number',x.incoming??0)+field('Salida (kg)','outgoing','number',x.outgoing??0)+field('Inspección','check','select',x.check||'Pendiente',['Conforme','Con observaciones','Pendiente']));break;
case'shipment':formWrap(kind,id,'Registrar entrega a tercero',field('Fecha','date','date',x.date||today(),null,false,true)+field('Residuo','wasteId','select',x.wasteId||db.wastes[0]?.id,db.wastes.map(w=>w.id+'|'+w.name),false,true)+field('Cantidad (kg)','qty','number',x.qty??0,null,false,true)+field('Operador','operator','text',x.operator||'',null,false,true)+field('Destino / operación','destination','text',x.destination||'',null,false,true)+field('Documento de entrega','document','text',x.document||'',null,false,true)+field('Documento especial/manifiesto','hazardDoc','text',x.hazardDoc||'Por verificar')+field('Estado','status','select',x.status||'Pendiente',['Pendiente','En tránsito','Recepción confirmada','Observado'])+field('Observaciones','notes','textarea',x.notes||'',null,true));break;
case'incident':formWrap(kind,id,'Registrar incidente',field('Fecha','date','date',x.date||today(),null,false,true)+field('Tipo de evento','type','text',x.type||'',null,false,true)+field('Área','area','text',x.area||'')+field('Nivel de severidad','severity','select',x.severity||'Bajo',['Bajo','Medio','Alto','Crítico'])+field('Responsable','responsible','text',x.responsible||'')+field('Estado','status','select',x.status||'Abierto',['Abierto','En investigación','Cerrado'])+field('Acciones / medidas correctivas','action','textarea',x.action||'',null,true,true));break;
case'budget':formWrap(kind,id,'Partida presupuestaria',field('Concepto','item','text',x.item||'',null,true,true)+field('Categoría','category','select',x.category||'Servicio',['Equipamiento','Infraestructura','Seguridad','Capacitación','Servicio','Control','Personal','Otro'])+field('Frecuencia','frequency','select',x.frequency||'Anual',['Única','Mensual','Trimestral','Anual'])+field('Costo estimado (S/)','amount','number',x.amount??0,null,false,true));break;
case'schedule':formWrap(kind,id,'Actividad del cronograma',field('Actividad','task','text',x.task||'',null,true,true)+field('Inicio','start','date',x.start||today())+field('Fin','end','date',x.end||today())+field('Responsable','owner','text',x.owner||'')+field('Estado','status','select',x.status||'Pendiente',['Pendiente','En curso','Completada','Reprogramada']));break;
case'training':formWrap(kind,id,'Registro de capacitación',field('Fecha','date','date',x.date||today(),null,false,true)+field('Tema','topic','text',x.topic||'',null,true,true)+field('Público objetivo','audience','text',x.audience||'Trabajadores y contratistas')+field('Facilitador','trainer','text',x.trainer||'')+field('Asistentes','attendees','number',x.attendees??0)+field('Personal convocado','total','number',x.total??db.config.workers)+field('Estado','status','select',x.status||'Programada',['Programada','Ejecutada','Pendiente','Reprogramada']));break;
case'inspection':formWrap(kind,id,'Registro de inspección',field('Fecha','date','date',x.date||today(),null,false,true)+field('Área','area','text',x.area||'Almacén central de residuos',null,false,true)+field('Resultado','result','select',x.result||'Con observaciones',['Conforme','Con observaciones','No conforme'])+field('Puntos revisados','points','number',x.points??8)+field('Puntos conformes','ok','number',x.ok??0)+field('Responsable','responsible','text',x.responsible||'Coordinador Ambiental')+field('Hallazgos y acciones','findings','textarea',x.findings||'',null,true)+field('Acción cerrada','closed','select',x.closed?'Sí':'No',['Sí','No']));break;
case'doc':formWrap(kind,id,'Documento y control normativo',field('Nombre del documento','name','text',x.name||'',null,true,true)+field('Tipo','type','select',x.type||'Registro interno',['Normativa de referencia','Instrumento ambiental','Manifiesto/constancia','Procedimiento','Registro interno','Contrato','Otro'])+field('Estado de revisión','status','select',x.status||'Pendiente de verificación',['Vigente verificado','Pendiente de verificación','Requiere actualización','No aplicable - justificar'])+field('Fecha de revisión','date','date',x.date||today())+field('Observaciones','notes','textarea',x.notes||'',null,true));break;
}}
function findItem(kind,id){let map={waste:'wastes',generation:'generations',initiative:'initiatives',storage:'storage',shipment:'shipments',incident:'incidents',budget:'budget',schedule:'schedule',training:'training',inspection:'inspections',doc:'docs'};return db[map[kind]]?.find(x=>x.id===id)||{}}
function editWaste(id){openForm('waste',id)}
function editGeneration(id){openForm('generation',id)}
function editItem(arr,id,kind){openForm(kind,id)}
function submitForm(e,kind,id){e.preventDefault();let form=e.target;let o=Object.fromEntries(new FormData(form).entries());for(let k in o){if(['qty','baseline','target','progress','opening','incoming','outgoing','amount','attendees','total','points','ok'].includes(k))o[k]=Number(o[k]||0);if(k==='closed')o[k]=o[k]==='Sí'}
let map={waste:'wastes',generation:'generations',initiative:'initiatives',storage:'storage',shipment:'shipments',incident:'incidents',budget:'budget',schedule:'schedule',training:'training',inspection:'inspections',doc:'docs'};let arr=db[map[kind]];if(!arr)return;
if(kind==='generation'){let w=waste(o.wasteId);o.area=o.area||w.area}
if(kind==='inspection'&&typeof o.closed!=='boolean')o.closed=o.closed==='Sí';
if(id){let idx=arr.findIndex(x=>x.id===id);if(idx>=0)arr[idx]={...arr[idx],...o}}else{arr.unshift({id:uid(),...o})}
save();closeModal();render();toast('Registro guardado correctamente.')}
function del(arr,id){if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.'))return;db[arr]=db[arr].filter(x=>x.id!==id);save();render();toast('Registro eliminado.')}
function toggleIncident(id){let x=db.incidents.find(i=>i.id===id);if(x)x.status=x.status==='Cerrado'?'Abierto':'Cerrado';save();render();toast('Estado actualizado.')}
function toggleInspection(id){let x=db.inspections.find(i=>i.id===id);if(x)x.closed=!x.closed;save();render();toast('Hallazgo actualizado.')}
function saveConfig(){let ids=['company','activity','location','ruc','workers','period','version','elaborated','approved','baseline','targetReduction','targetValorization','notes'];ids.forEach(k=>{let el=document.getElementById('cfg_'+k);if(el)db.config[k]=['workers','baseline','targetReduction','targetValorization'].includes(k)?Number(el.value||0):el.value});save();render();toast('Configuración actualizada.')}
function resetData(){if(!confirm('Esto reemplazará los registros actuales por los datos de ejemplo. ¿Continuar?'))return;db=JSON.parse(JSON.stringify(defaults));save();go('dashboard');toast('Datos demostrativos restaurados.')}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});downloadBlob(blob,'SA_Andinos_respaldo_PMMRS.json');toast('Respaldo preparado.')}
function exportCSV(arrName){let arr=db[arrName]||[];if(!arr.length){toast('No hay datos para exportar.');return}let keys=[...new Set(arr.flatMap(o=>Object.keys(o)))];let csv=[keys.join(';'),...arr.map(o=>keys.map(k=>{let v=o[k]??'';return '"'+String(v).replace(/"/g,'""')+'"'}).join(';'))].join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`SA_Andinos_${arrName}.csv`);toast('CSV exportado.')}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function calcBalance(){let a=+document.getElementById('balOpen').value||0,g=+document.getElementById('balGen').value||0,v=+document.getElementById('balVal').value||0,d=+document.getElementById('balDisp').value||0,fin=a+g-v-d,el=document.getElementById('balResult');el.innerHTML=fin<0?`<span style="color:#b93838"><b>Balance no cierra:</b> las salidas exceden stock inicial más generación por ${num(Math.abs(fin))} kg. Revise periodo, inventario y unidades.</span>`:`<b>Stock final calculado: ${num(fin)} kg</b><br>Stock inicial + generación = ${num(a+g)} kg; valorización + tratamiento/disposición + stock final = ${num(v+d+fin)} kg. Verifique que todos los datos correspondan al mismo periodo y alcance.`}
function calcEconomics(){let inc=+document.getElementById('benefitIncome').value||0,savev=+document.getElementById('benefitSave').value||0,subtotal=total(db.budget,'amount'),net=subtotal*1.1-inc-savev;document.getElementById('economicsResult').innerHTML=`Beneficio total estimado: <b>${money(inc+savev)}</b><br>Presupuesto con contingencia: <b>${money(subtotal*1.1)}</b><br>Costo neto ilustrativo: <b>${money(net)}</b><br><span class="small">No incluir beneficios hipotéticos como ingresos confirmados sin evidencia contable.</span>`}
load();go('dashboard');
</script>
